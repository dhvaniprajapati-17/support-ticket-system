spring.application.name=tickets
server.port=8080

# --- Database: local PostgreSQL (data persists across restarts) ---
# Each value can be overridden with an environment variable; the value after ":" is the default.
# The password is never stored here: set DB_PASSWORD if your PostgreSQL user needs one.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tickets}
spring.datasource.username=${DB_USERNAME:dhvaniprajapati}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# "update": create the tickets table if it does not exist yet, and keep existing tables and data.
# (The previous "create-drop" would delete all data on every shutdown, which defeats a real database.)
# Fine for a learning project; real projects use a migration tool such as Flyway instead.
spring.jpa.hibernate.ddl-auto=update
# Log the generated SQL so you can see what JPA does behind the scenes.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Don't keep a DB session open during view rendering (we only return JSON).
spring.jpa.open-in-view=false

# --- Sample data (data.sql) ---
# Spring Boot runs data.sql automatically only for embedded databases like H2, so enable it for PostgreSQL.
# data.sql only inserts when the tickets table is empty, so restarts do not create duplicates.
spring.sql.init.mode=always
# Run data.sql *after* Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
